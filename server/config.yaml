# Chenify 后端配置
server:
    port: 8080

database:
    # sqlite 数据库文件路径（相对本文件所在目录）
    path: ./app.db

# JWT 配置不在本文件维护，由环境变量控制（见 .env.production / .env.development）：
#   JWT_SECRET       签名密钥（HS256）
#   JWT_EXPIRES_DAYS 有效期天数，默认 7 天
# 生产环境务必在平台注入与 .env.production 一致的 JWT_SECRET，保证签发/校验一致。

storage:
    # 资源文件存放方式：s3（S3API / MinIO）
    type: s3
    s3:
        # MinIO 或任意 S3 兼容服务的端点
        endpoint: 127.0.0.1:9000
        # 是否使用路径风格寻址（MinIO/自建服务必须为 true）
        use_path_style: true
        access_key: chenify
        secret_key: chenify-secret
        region: us-east-1
        # 图片/头像等公共资源的桶
        bucket: chenify-assets
        # 编程作品桶前缀，实际桶名为 <work_bucket_prefix>-<作品uuid>
        work_bucket_prefix: chenify-work

limits:
    # 图片单张最大字节（默认 2MB）
    max_image_size: 2097152
    # 单帖最多图片数
    max_images_per_post: 9
    # 作品文件单个最大字节（默认 100MB）
    max_work_file_size: 104857600

# 速率限制配置（单位：毫秒 / 次数）
rate_limit:
    # 注册：15 分钟内最多 5 次
    strict:
        window_ms: 900000
        max: 5
    # 登录：15 分钟内最多 10 次
    login:
        window_ms: 900000
        max: 10
    # 写入操作（发帖/编辑/草稿）：1 分钟内最多 10 次
    write:
        window_ms: 60000
        max: 10
    # 互动操作（点赞/收藏/打赏）：1 分钟内最多 30 次
    interact:
        window_ms: 60000
        max: 30
    # 关注/隐私设置：1 分钟内最多 20 次
    follow:
        window_ms: 60000
        max: 20
    # 读取操作：1 分钟内最多 120 次
    read:
        window_ms: 60000
        max: 120
    # OAuth 相关：1 分钟内最多 60 次
    oauth:
        window_ms: 60000
        max: 60
